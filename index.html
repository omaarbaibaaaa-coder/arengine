<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Quaternion Biology Lab</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030307; }
        canvas { display: block; }
        /* Minimal styling for the GUI */
        .dg.ac { z-index: 100 !important; }
    </style>
</head>
<body>

    <!-- Import Three.js and dat.GUI -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r161/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030307, 0.05);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping; // Adds bloom effect
        document.body.appendChild(renderer.domElement);

        // 2. SIMULATION SETTINGS OBJECT (The "Genetics")
        // This is the object the GUI will modify in real-time.
        const settings = {
            // Lattice Geometry
            theta: Math.PI * 0.25, // Fundamental angle
            baseRadius: 3.0,
            totalAtoms: 150,
            
            // Metabolism (Breathing Pulse)
            pulseFreq: 2.0,
            pulseAmp: 0.15,
            noiseStrength: 0.02, // Adds organic jitter

            // Visualization
            atomColor: 0x38bdf8, // Cyan
            emissiveIntensity: 0.4,
            wireframe: false,
            spinSpeed: 0.2
        };

        // 3. GUI SETUP
        const gui = new dat.GUI();
        
        // Folder 1: Lattice Genetics (Controls Geometry)
        const geomFolder = gui.addFolder('Quaternion Lattice Genetics');
        geomFolder.add(settings, 'theta', 0, Math.PI).name('Fundamental Angle (θ)');
        geomFolder.add(settings, 'baseRadius', 1, 6).name('Base Radius');
        geomFolder.add(settings, 'totalAtoms', 50, 500).step(1).name('Atom Count (N)').onChange(regenerateLattice);
        geomFolder.open();

        // Folder 2: Metabolic Rhythm (Controls Animation)
        const rhythmFolder = gui.addFolder('Metabolic Rhythm');
        rhythmFolder.add(settings, 'pulseFreq', 0.1, 10).name('Pulse Frequency');
        rhythmFolder.add(settings, 'pulseAmp', 0, 0.5).name('Pulse Amplitude');
        rhythmFolder.add(settings, 'noiseStrength', 0, 0.1).name('Organic Jitter');
        rhythmFolder.open();

        // Folder 3: Visualization (Controls Aesthetics)
        const visFolder = gui.addFolder('Visualization');
        visFolder.addColor(settings, 'atomColor').name('Atom Color').onChange(updateMaterial);
        visFolder.add(settings, 'emissiveIntensity', 0, 2).name('Glow Intensity').onChange(updateMaterial);
        visFolder.add(settings, 'wireframe').name('Wireframe Mode').onChange(updateMaterial);
        visFolder.add(settings, 'spinSpeed', 0, 1).name('Global Spin');

        // 4. GEOMETRY & MESHES
        let atomMesh;
        const atomGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const atomMaterial = new THREE.MeshStandardMaterial({ 
            color: settings.atomColor,
            emissive: settings.atomColor,
            emissiveIntensity: settings.emissiveIntensity,
            roughness: 0.1,
            metalness: 0.8
        });

        function updateMaterial() {
            atomMaterial.color.set(settings.atomColor);
            atomMaterial.emissive.set(settings.atomColor);
            atomMaterial.emissiveIntensity = settings.emissiveIntensity;
            atomMaterial.wireframe = settings.wireframe;
        }

        // Helper: Fibonacci sphere distribution for even points
        function getFibonacciSpherePoint(i, n) {
            const phi = Math.PI * (3 - Math.sqrt(5)); // Golden angle
            const y = 1 - (i / (n - 1)) * 2; // y goes from 1 to -1
            const radiusAtY = Math.sqrt(1 - y * y); // radius at y
            const theta = phi * i; // golden angle increment
            return new THREE.Vector3(
                Math.cos(theta) * radiusAtY,
                y,
                Math.sin(theta) * radiusAtY
            );
        }

        // Data array to store per-atom metadata for animation
        let atomMetaData = [];
        const dummy = new THREE.Object3D();

        function regenerateLattice() {
            // Remove old mesh if it exists
            if (atomMesh) scene.remove(atomMesh);
            
            atomMetaData = [];
            atomMesh = new THREE.InstancedMesh(atomGeometry, atomMaterial, settings.totalAtoms);
            scene.add(atomMesh);

            for (let i = 0; i < settings.totalAtoms; i++) {
                const v = getFibonacciSpherePoint(i, settings.totalAtoms);

                // Apply polar quaternion orientation based on position vector
                // q = cos(theta) + sin(theta) * v
                const q = new THREE.Quaternion(
                    v.x * Math.sin(settings.theta),
                    v.y * Math.sin(settings.theta),
                    v.z * Math.sin(settings.theta),
                    Math.cos(settings.theta)
                );

                atomMetaData.push({
                    basePos: v.clone().multiplyScalar(settings.baseRadius),
                    quaternion: q,
                    // Give each atom a slightly different phase for organic waves
                    phase: Math.random() * Math.PI * 2,
                    // Random vector for jitter
                    noiseVec: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize()
                });

                // Initialize matrix
                dummy.position.copy(atomMetaData[i].basePos);
                dummy.quaternion.copy(q);
                dummy.updateMatrix();
                atomMesh.setMatrixAt(i, dummy.matrix);
            }
            atomMesh.instanceMatrix.needsUpdate = true;
        }

        // Initial generation
        regenerateLattice();

        // 5. LIGHTING
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pointLight = new THREE.PointLight(0x38bdf8, 20, 10);
        pointLight.position.set(0, 2, 5);
        scene.add(pointLight);

        const backLight = new THREE.DirectionalLight(0xf43f5e, 3);
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        camera.position.set(0, 0, 8);

        // 6. LIVING ANIMATION LOOP
        function animate(time) {
            requestAnimationFrame(animate);
            const t = time * 0.001; // Time in seconds

            if (atomMesh) {
                // Apply global spin
                atomMesh.rotation.y = t * settings.spinSpeed;
                atomMesh.rotation.x = Math.sin(t * 0.2) * 0.2;

                atomMetaData.forEach((atom, idx) => {
                    // A. Calculate Metabolic Pulse (Breathing)
                    const pulse = Math.sin(t * settings.pulseFreq + atom.phase) * settings.pulseAmp;
                    
                    // B. Add Organic Jitter (Noise)
                    const jitter = atom.noiseVec.clone().multiplyScalar(Math.random() * settings.noiseStrength);

                    // C. Update Position
                    const currentPos = atom.basePos.clone().multiplyScalar(1 + pulse).add(jitter);
                    dummy.position.copy(currentPos);

                    // D. Keep Quaternion Orientation (The structural integrity)
                    dummy.quaternion.copy(atom.quaternion);
                    
                    // E. Update Scale (Optional organic growth pulse)
                    const scale = 1 + pulse * 0.5;
                    dummy.scale.set(scale, scale, scale);

                    dummy.updateMatrix();
                    atomMesh.setMatrixAt(idx, dummy.matrix);
                });

                atomMesh.instanceMatrix.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
        animate(0);

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
